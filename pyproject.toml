[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "omnidispatch"
version = "0.1.0"
description = "Account-bound, auditable multi-platform publishing orchestrator"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3", "cryptography>=44", "argon2-cffi>=23", "httpx>=0.28,<1", "python-multipart>=0.0.20", "pyotp>=2.9,<3", "packaging>=24", "psycopg[binary]>=3.2,<4"]
[project.scripts]
omnidispatch = "omnidispatch.cli:main"
[tool.setuptools.packages.find]
include = ["omnidispatch*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
