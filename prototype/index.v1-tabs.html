<html lang="zh-CN">

<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --rose:#E87C8D;
  --amber:#F9CB8E;
  --ink:#2E1B19;
  --ink2:#7A625C;
  --ink3:#B9A6A0;
  --hair:rgba(46,27,25,.13);
  --hair2:rgba(46,27,25,.07);
  --paper:#FFF9F5;
  --mono:"SF Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;
  --sans:"PingFang SC","HarmonyOS Sans SC","Source Han Sans SC","Noto Sans SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:15px;line-height:1.62;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  letter-spacing:.008em;font-variant-numeric:tabular-nums;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.wash{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:

      rgba(232,124,141,.38) 0%,
      rgba(238,158,138,.26) 20%,
      rgba(249,203,142,.28) 44%,
      rgba(255,246,239,.60) 66%,
      rgba(255,250,246,0) 86%);
}
.sheet{position:relative;z-index:1;max-width:1208px;margin:0 auto;padding:0 56px}

/* masthead */
header{padding-top:70px}
.topline{display:flex;justify-content:space-between;align-items:baseline;gap:24px}
.wordmark{font-size:10.5px;letter-spacing:.36em;font-weight:700}
.stamp{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;color:var(--ink3)}
h1{margin:62px 0 0;font-size:54px;line-height:1.12;font-weight:600;letter-spacing:-.025em;max-width:20em}
h1 em{font-style:normal;color:var(--rose)}
.lead{margin:24px 0 0;font-size:15px;color:var(--ink2);max-width:30em;line-height:1.75}
.scale{margin:34px 0 0;display:flex;flex-wrap:wrap;align-items:baseline;font-size:11px;letter-spacing:.06em;color:var(--ink3)}
.scale span+span::before{content:"·";margin:0 12px;color:var(--ink3);opacity:.6}
.scale b{font-weight:600;color:var(--ink2);font-family:var(--mono);font-size:11.5px}

/* tabs */
.tabs{display:flex;gap:38px;margin-top:52px;border-top:1px solid var(--hair)}
.tab{padding:19px 0 17px;font-size:13.5px;letter-spacing:.05em;color:var(--ink3);
  border-bottom:1px solid transparent;margin-bottom:-1px;
  transition:color .45s cubic-bezier(.22,1,.36,1),border-color .45s cubic-bezier(.22,1,.36,1)}
.tab.on{color:var(--ink);border-bottom-color:var(--ink)}
.tab:hover{color:var(--ink2)}

/* layout */
main{display:grid;grid-template-columns:minmax(0,1fr) 286px;gap:92px;
  padding:42px 0 130px;align-items:start}
.view{min-width:0}
.view[hidden]{display:none}

/* tree */
.tree{position:relative}
.tree::before{content:"";position:absolute;left:9px;top:26px;bottom:28px;width:1px;background:var(--hair)}
.src{position:relative}
.node{position:relative;display:grid;align-items:center;width:100%;
  grid-template-columns:252px minmax(0,1fr) 52px 74px;padding:15px 0 15px 34px}
.mk{position:absolute;left:5.5px;top:50%;width:7px;height:7px;margin-top:-4px;border-radius:50%;
  border:1px solid rgba(46,27,25,.30);background:var(--paper);
  transition:background .45s cubic-bezier(.22,1,.36,1),border-color .45s,transform .45s cubic-bezier(.22,1,.36,1)}
.src.on .mk{background:var(--rose);border-color:var(--rose);transform:scale(1.3)}
.node:hover .mk{border-color:var(--rose)}
.name{display:block;font-weight:600;letter-spacing:-.012em;line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:color .4s cubic-bezier(.22,1,.36,1)}
.src.on .name{color:#1F100E}
.bar{position:relative;height:3px;border-radius:2px;background:rgba(46,27,25,.065);margin-right:26px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;
  background:linear-gradient(90deg,var(--rose),var(--amber));
  transition:width 1.05s cubic-bezier(.16,1,.3,1)}
.pct{text-align:right;font-family:var(--mono);font-size:11px;color:var(--ink2)}
.dots{display:flex;justify-content:flex-end;gap:6px}
.d{width:5px;height:5px;border-radius:50%}
.d.ok{background:rgba(46,27,25,.42)}
.d.warn{background:var(--rose)}
.d.down{border:1px solid rgba(46,27,25,.22)}
.d.na{border:1px dotted rgba(46,27,25,.18)}

/* children */
.kids{position:relative;margin:0 0 10px;padding:0;display:none}
.src.on .kids{display:block;animation:unfold .42s cubic-bezier(.22,1,.36,1)}
@keyframes unfold{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.kid{position:relative;display:flex;align-items:baseline;gap:14px;padding:7px 0 7px 54px}
.kid::before{content:"";position:absolute;left:9px;top:50%;width:32px;height:1px;background:var(--hair2)}
.kid .kn{font-size:13px;color:var(--ink2);letter-spacing:.01em;white-space:nowrap}
.kid .ks{font-size:11.5px;color:var(--ink3);letter-spacing:.05em;white-space:nowrap}
.kid .kl{font-size:11.5px;color:var(--ink3);font-family:var(--mono);white-space:nowrap}
.kid.warn .kn{color:#5B3330}
.kid.warn .ks{color:var(--rose)}
.kid.down .kn{color:var(--ink3)}
.kid.down .ks{color:rgba(46,27,25,.28)}
.kid.na .kn{color:rgba(46,27,25,.25)}
.kid.na .ks{color:rgba(46,27,25,.20)}
.treenote{margin:22px 0 0;padding-left:34px;font-size:10.5px;letter-spacing:.05em;color:var(--ink3)}

/* aside */
.rail{position:sticky;top:52px;padding-left:30px;border-left:1px solid var(--hair)}
.eyebrow{display:block;font-size:9.5px;letter-spacing:.30em;font-weight:700;color:var(--ink3);text-transform:uppercase}
.rail h2{margin:16px 0 0;font-size:23px;line-height:1.2;font-weight:600;letter-spacing:-.02em;word-break:break-word}
.rail .repo{margin:8px 0 0;font-family:var(--mono);font-size:10.5px;color:var(--ink3);

.rel{list-style:none;margin:34px 0 0;padding:0}

.rel li:first-child{border-top:0;padding-top:0}
.rl{display:flex;justify-content:space-between;align-items:baseline;gap:12px}

.rl .ago{font-size:10.5px;color:var(--ink3);letter-spacing:.04em;white-space:nowrap}
.rn{margin-top:3px;font-size:11px;color:var(--ink3);letter-spacing:.02em;line-height:1.5}
.railfoot{margin-top:30px;padding-top:20px;border-top:1px solid var(--hair);font-size:11px;color:var(--ink3);line-height:1.75}
.rhint{margin:18px 0 0;font-size:12px;color:var(--ink2);line-height:2.0;letter-spacing:.02em}
.rhint em{font-style:normal;color:var(--ink3)}
.legend{margin-top:26px;display:flex;gap:16px;font-size:10px;letter-spacing:.06em;color:var(--ink3)}
.legend i{display:inline-block;width:5px;height:5px;border-radius:50%;margin-right:6px;vertical-align:1px}
.legend .ok{background:rgba(46,27,25,.42)}
.legend .warn{background:var(--rose)}
.legend .down{border:1px solid rgba(46,27,25,.22)}

/* regions */
.rg{padding:21px 0;border-top:1px solid var(--hair2)}
.rg:first-child{border-top:0;padding-top:6px}
.rgtop{display:flex;justify-content:space-between;align-items:baseline;gap:20px}
.rgn{font-size:19px;font-weight:600;letter-spacing:-.012em}
.rgp{font-family:var(--mono);font-size:12px;color:var(--ink2)}
.rgbar{position:relative;height:3px;margin-top:14px;border-radius:2px;background:rgba(46,27,25,.06)}
.rgbar i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;

.rg.void .rgn,.rg.void .rgp{color:rgba(46,27,25,.30)}

.rg.chrome{opacity:.42;padding:14px 0 0}
.rg.chrome .rgn{font-size:11.5px;font-weight:500;letter-spacing:.05em}
.rg.chrome .rgp{font-size:10.5px}
.rg.chrome .rgbar{height:1px;margin-top:9px}

/* feed */

.day+.day{margin-top:26px}
.dlabel{display:block;font-size:10.5px;letter-spacing:.16em;color:var(--ink3);
  font-family:var(--mono);padding-bottom:10px;border-bottom:1px solid var(--hair2)}
.ev{display:grid;grid-template-columns:130px minmax(0,1fr);gap:26px;align-items:baseline;
  padding:15px 0;border-bottom:1px solid var(--hair2)}
.ev:last-child{border-bottom:0}
.evs{font-family:var(--mono);font-size:11.5px;color:var(--ink2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evt{font-family:var(--mono);font-size:12.5px;color:var(--ink2)}
.evt .act{font-family:var(--sans);margin-left:9px;font-size:11.5px;color:var(--ink3);letter-spacing:.10em}
.evt .act.w{color:var(--rose)}
.evn{display:block;font-family:var(--sans);margin-top:4px;font-size:11.5px;color:var(--ink3);letter-spacing:.02em}

footer{display:flex;justify-content:space-between;align-items:baseline;gap:24px;
  padding:26px 0 64px;border-top:1px solid var(--hair);
  font-size:10.5px;color:var(--ink3);letter-spacing:.14em}

@media (max-width:1120px){
  .sheet{padding:0 34px}
  main{grid-template-columns:1fr;gap:52px}
  .rail{position:static;border-left:0;padding-left:0;border-top:1px solid var(--hair);padding-top:34px}
  h1{font-size:40px}
  .node{grid-template-columns:200px minmax(0,1fr) 48px 68px}

</style>
</head>

    { s:'patchright', v:'v1.64.1', a:'到达', n:'无构建产物', w:false } ] },
  { d:'2026-09-22', ev:[
    { s:'xiaohongshu-mcp', v:'v2.5.5', a:'到达', n:'6 个构建产物 · 至今 40 天未再发，仍为最新', w:false } ] }
];

/* ── 百分比：最大余数法，合计精确 100.0 ───────────────────── */
function shares(ws){
  const t = ws.reduce((a,b)=>a+b,0) || 1;
  const raw = ws.map(w => w / t * 100);
  const out = raw.map(x => Math.floor(x * 10) / 10);
  let drift = Math.round((100 - out.reduce((a,b)=>a+b,0)) * 10);
  const order = raw.map((x,i)=>[x - out[i], i]).sort((a,b)=>b[0]-a[0]).map(x=>x[1]);
  let k = 0;
  while (drift > 0) { out[order[k % order.length]] = +(out[order[k % order.length]] + 0.1).toFixed(1); drift--; k++; }
  return out;
}

/* ── 派生 ─────────────────────────────────────────────────── */
const chAll = sources.flatMap(s => s.ch);
const okCount = chAll.filter(c => c.s === 'ok').length;
const warnCount = chAll.filter(c => c.s === 'warn').length;
const downCount = chAll.filter(c => c.s === 'down').length;
const nodeShare = shares(sources.map(s => s.w));
const maxShare = Math.max(...nodeShare);
const fontOf = sh => (12.5 + 9.5 * Math.pow(sh / maxShare, .80)).toFixed(1) + 'px';
const barOf  = sh => (sh / maxShare * 100).toFixed(2);

/* ── 刻度 ─────────────────────────────────────────────────── */
document.getElementById('stamp').textContent =
  '来源跟进 · ' + new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',
  month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(NOW);

document.getElementById('scale').innerHTML = [
  ['来源', sources.length], ['渠道', chAll.length], ['可达', okCount],
  ['降级', warnCount], ['不可达', downCount],
  ['无路径区域', regions.filter(r => r.void).length]
].map(([k,v]) => `<span>${k} <b>${v}</b></span>`).join('');

/* ── 来源树 ───────────────────────────────────────────────── */
const treeEl = document.getElementById('tree');
let selected = 'sau', currentView = 'sources';

treeEl.innerHTML = sources.map((s, i) => {
  const dots = s.ch.slice(0, 5).map(c => `<i class="d ${c.s}"></i>`).join('');
  return `
  <div class="src${s.id === selected ? ' on' : ''}" data-id="${s.id}">
    <button class="node" data-id="${s.id}">
      <span class="mk"></span>
      <span class="name" style="font-size:${fontOf(nodeShare[i])}">${s.name}</span>
      <span class="bar"><i style="width:${barOf(nodeShare[i])}%"></i></span>
      <span class="pct">${nodeShare[i].toFixed(1)}%</span>
      <span class="dots">${dots}</span>
    </button>
    <div class="kids">
      ${s.ch.map(c => `
        <div class="kid ${c.s}">
          <span class="kn">${c.n}</span>
          <span class="ks">${{ok:'可达',warn:'降级',down:'不可达',na:'不适用'}[c.s]}</span>
          <span class="kl">${c.l}</span>
        </div>`).join('')}
    </div>
  </div>`;
}).join('') + `<p class="treenote">条形按最大节点归一；右侧百分比是真实占比，合计 100%。点开一个来源，看它的每条路。</p>`;

/* ── 右栏 ─────────────────────────────────────────────────── */
const rail = document.getElementById('rail');
const legendHTML = `<div class="legend">
  <span><i class="ok"></i>可达</span>
  <span><i class="warn"></i>降级</span>
  <span><i class="down"></i>不可达</span>
</div>`;

function asideSources(id){
  const s = sources.find(x => x.id === id);
  const okRel = s.rel.filter(r => r.v !== '—');
  const span = okRel.length > 1
    ? Math.round((new Date(okRel[0].d) - new Date(okRel[okRel.length-1].d)) / DAY) : 0;
  const gap = okRel.length > 1 ? Math.round(span / (okRel.length - 1)) : 0;

  rail.innerHTML = `
    <span class="eyebrow">最近发版</span>
    <h2>${s.name}</h2>
    <p class="repo">${s.repo}</p>
    <ol class="rel">
      ${s.rel.map(r => `
        <li>
          <div class="rl"><b>${r.v}</b><span class="ago">${r.d ? ago(r.d) : '—'}</span></div>
          <div class="rn">${r.m}</div>
        </li>`).join('')}
    </ol>
    <div class="railfoot">
      ${okRel.length > 1
        ? `最近三次跨度 ${span} 天，平均 ${gap} 天一次。<br>版本、签名与运行方式由来源项目自持，这里不解释。`
        : `此来源没有可对照的发行节奏。<br>版本、签名与运行方式由来源项目自持，这里不解释。`}
    </div>
    ${legendHTML}`;
}

function asideRegions(){
  rail.innerHTML = `
    <span class="eyebrow">口径</span>
    <h2>独立算的。</h2>
    <p class="rhint">可用渠道 <em>×8</em><br>＋ 在用来源 <em>×4</em><br>＋ 近 30 天活跃 <em>×3</em><br>＋ 待接入来源 <em>×2</em></p>
    <div class="railfoot">与来源树的节点占比分开计算，两者互不推导。<br>没有可用渠道的区域掉到最后，但不被抹掉。</div>
    ${legendHTML}`;
}

function asideFeed(){
  rail.innerHTML = `
    <span class="eyebrow">记录规则</span>
    <h2>只记到达。</h2>
    <p class="rhint">到达，或者不到达。<br>不发通知，不建收件箱，不做未读。</p>
    <div class="railfoot">最近 6 天 8 条。<br>版本号归来源项目所有，这里只登记它到了没有。</div>
    ${legendHTML}`;
}

const renderAside = v => v === 'regions' ? asideRegions()
  : v === 'feed' ? asideFeed() : asideSources(selected);

/* ── 区域列表 ─────────────────────────────────────────────── */
const regionShare = shares(regions.map(r => r.w));
document.getElementById('regionlist').innerHTML = regions.map((r, i) => `
  <div class="rg${r.void ? ' void' : ''}${r.chrome ? ' chrome' : ''}">
    <div class="rgtop"><span class="rgn">${r.n}</span><span class="rgp">${regionShare[i].toFixed(1)}%</span></div>
    <div class="rgbar"><i style="width:${regionShare[i]}%"></i></div>
    <div class="rgmeta">${r.meta}</div>
  </div>`).join('');

/* ── 跟进列表 ─────────────────────────────────────────────── */
const wd = ['周日','周一','周二','周三','周四','周五','周六'];
document.getElementById('feedlist').innerHTML = feed.map(day => {
  const d = new Date(day.d + 'T09:00:00+08:00');
  const label = `${String(d.getMonth()+1).padStart(2,'0')} 月 ${String(d.getDate()).padStart(2,'0')} 日 · ${wd[d.getDay()]} · ${ago(day.d)}`;
  return `<div class="day"><span class="dlabel">${label}</span>
    ${day.ev.map(e => `
      <div class="ev">
        <span class="evs">${e.s}</span>
        <span class="evt">${e.v}<span class="act${e.w ? ' w' : ''}">${e.a}</span>
          <span class="evn">${e.n}</span></span>
      </div>`).join('')}
  </div>`;
}).join('');

/* ── 交互 ─────────────────────────────────────────────────── */
asideSources(selected);

treeEl.addEventListener('click', e => {
  const btn = e.target.closest('.node'); if (!btn) return;
  selected = btn.dataset.id;
  document.querySelectorAll('.src').forEach(el => el.classList.toggle('on', el.dataset.id === selected));
  renderAside(currentView);
});

document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('.tab'); if (!b) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t === b));
  currentView = b.dataset.view;
  document.querySelectorAll('.view').forEach(el => el.hidden = el.id !== 'view-' + currentView);
  renderAside(currentView);
});

/* 原型：#regions / #feed 直接落到对应视图，便于截图 */
const h = location.hash.slice(1);
if (h === 'regions' || h === 'feed') {
  const t = document.querySelector('.tab[data-view="' + h + '"]');
  if (t) t.click();
}
</script>
</body>
</html>
